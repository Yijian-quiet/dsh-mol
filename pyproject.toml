[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-mol"
version = "0.0.1"
description = "Local-first chemistry toolkit for AI agents (RDKit, no network): SMILES validation, drawing, properties, drug-likeness, conversion, standardisation, batch clean-up | 本地优先的化学工具台"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["chemistry", "rdkit", "smiles", "cheminformatics", "mcp", "deepseek-harness", "ai4s"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["rdkit>=2023.9"]

[project.optional-dependencies]
# 必须 1.x：2.x 把 FastMCP 改名 MCPServer 且 API 破坏性变更（CI 实测踩到）
mcp = ["mcp>=1.0,<2"]
dev = ["mcp>=1.0,<2"]

[project.scripts]
dsh-mol-mcp = "dsh_mol_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Yijian-quiet/dsh-mol"
Source = "https://github.com/Yijian-quiet/dsh-mol"
Issues = "https://github.com/Yijian-quiet/dsh-mol/issues"
Changelog = "https://github.com/Yijian-quiet/dsh-mol/commits/main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
