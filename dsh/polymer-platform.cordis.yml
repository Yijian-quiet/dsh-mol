# 【可选】把高分子平台的"深度服务"接进 DSH —— 与 chemworkbench 的本地工具并存。
#
# ⚠️ 这份 overlay **不属于公开的 dsh-bundle**：它依赖你自己平台上的私有服务
#    （`polymer-ai-platform/mcp`，只绑回环的只读代理）。
#    公开仓库里保留它，是作为「如何接入一个私有 HTTP MCP 服务」的示例。
#
# 它接进来的 6 个工具（模型侧名字形如 `mcp__polymer__polymer_predict`）：
#     polymer_predict        性质预测（Tg / ε，真推理）
#     polymer_render         结构渲染
#     polymer_assemble       单体组装成聚合物
#     polymer_monomers       单体库
#     polymer_known_lookup   手册对照值查询
#     dataset_list           数据资产清单
#
# 与本地工具的分工：**本地的 chemworkbench 负责"通用化学基础"（零网络、离线可用）；
# 这里负责"领域深度"（需要平台在跑）**。平台不在时，`failOnStartupError: false`
# 保证 DSH 照常启动，只是这 6 个工具不出现 —— 本地工具不受影响。
#
# 前置条件：
#   1. 平台服务在跑（inference :9000 + backend :8000）
#   2. 平台 MCP 代理在跑：
#        MCP_TOKEN=<≥16位> POLYMER_STATE_DIR=<APP_DIR>/state \
#          python3 mcp/server.py --port 9100
#   3. 导出令牌（**不要把令牌写进本文件**）：
#        export POLYMER_MCP_TOKEN=<同一个令牌>
#
# 用法：
#   set -a; . ~/dsh/env.sh; set +a
#   export POLYMER_MCP_TOKEN=...
#   dsh --profile headless --patch dsh/chemworkbench.cordis.yml \
#       --patch dsh/polymer-platform.cordis.yml "用 polymer_predict 算一下 PET 的 Tg"
#
# 长期生效：把下面的 insert 条目合并进
#   $DSH_HOME/profiles/<name>/cordis.patch.yml （单 profile）或
#   $DSH_HOME/cordis.patch.yml                  （本机所有 profile）

- insert:
    - id: polymer-platform
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: polymer
        transport: streamable-http
        url: !!js process.env.POLYMER_MCP_URL ?? 'http://127.0.0.1:9100/mcp'
        headers:
          # 令牌从环境变量来，不落盘。平台侧是 Bearer 方案（见 /mcp/info）。
          # ⚠️ 表达式要以函数名开头：YAML 里以引号开头的标量会被当成引号字符串，
          #    后面再接 `+ …` 会直接解析失败（踩过一次）。
          Authorization: !!js String('Bearer ') + (process.env.POLYMER_MCP_TOKEN ?? '')
        # 真推理可能慢（尤其冷启动），给足时间
        toolCallTimeoutMs: 120000
        # 平台没起时不拖垮 DSH 启动：本地工具照常可用，只是这 6 个不出现
        failOnStartupError: false
